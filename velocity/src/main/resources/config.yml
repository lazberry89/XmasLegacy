# Copied to plugins/xmaslegacy-velocity/config.yml on first start. Edit that copy, not this one.
web:
  database:
    url: "jdbc:mysql://localhost:3306/xmas_legacy?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
    # Set per server in the copied config. Never commit real credentials.
    user: ""
    password: ""

# Read-only admin dashboard. Keys live in plugins/xmaslegacy-velocity/admin-keys.yml (keys: ["..."]),
# which is never committed. Without keys the dashboard does not start.
admin-web:
  enabled: true
  bind: "0.0.0.0"
  port: 8095

# Redis AUTH password (requirepass in redis.conf). Leave empty if Redis has none.
redis:
  password: ""
